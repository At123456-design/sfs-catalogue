.fgb{display:flex;flex-direction:column;gap:8px;padding-bottom:12px}
.lv{grid-template-columns:minmax(0,1fr)!important}

.lv .pic{width:88px;flex:none;border-bottom:0;align-self:center}
.lv .tb{flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px 16px;padding:8px 12px;min-width:0}
.lv .tn{flex:1 1 220px;min-width:0}.lv .tf{margin:0;padding:0;gap:16px;margin-inline-start:auto}.lv .tq{margin:0;flex:0 1 160px;min-width:0}

@keyframes ldFade{from{opacity:0}to{opacity:1}}

@keyframes ldBob{0%,100%{transform:none}50%{transform:translateY(-2.5px)}}
@keyframes bootOut{to{opacity:0;visibility:hidden}}
.boot{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px;background:var(--sf);color:var(--ink);animation:bootOut .4s ease 5s forwards}
